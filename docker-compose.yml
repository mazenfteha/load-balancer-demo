services:
  nginx:
    image: nginx:alpine
    depends_on:
      - api-1
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend

  api-1:
    build: .
    image: ${IMAGE_NAME}
    environment:
      INSTANCE_ID: api-1
    ports:
      - "${HOST_PORT_1}:3000"
    networks:
      - backend

  api-2:
    build: .
    image: ${IMAGE_NAME}
    environment:
      INSTANCE_ID: api-2
    ports:
      - "${HOST_PORT_2}:3000"
    networks:
      - backend

  api-3:
    build: .
    image: ${IMAGE_NAME}
    environment:
      INSTANCE_ID: api-3
    ports:
      - "${HOST_PORT_3}:3000"
    networks:
      - backend

networks:
  backend:
    driver: bridge